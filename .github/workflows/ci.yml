name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Shared mirrors in sync (protocol.ts, geo.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff shared/protocol.ts and shared/geo.ts against their mirrors
        run: |
          diff -u shared/protocol.ts server/src/protocol.ts
          diff -u shared/protocol.ts web/src/lib/protocol.ts
          diff -u shared/geo.ts server/src/geo.ts
          diff -u shared/geo.ts web/src/lib/geo.ts

  server:
    name: Server (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  # Deploys the game server to Fly.io after CI passes on main. Dormant until the
  # repo variable DEPLOY_FLY=true and the FLY_API_TOKEN secret are set. Builds on
  # Fly's remote builders (no local Docker), using server/fly.toml + Dockerfile.
  deploy-server:
    name: Deploy server (Fly.io)
    needs: [protocol, server, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_FLY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

# Netlify builds and deploys the web client on every push once the site is
# linked to this repo. Set VITE_WS_URL (wss://<backend-host>) in the Netlify UI.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA routing: refreshing /room/ABCD or /game/ABCD must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

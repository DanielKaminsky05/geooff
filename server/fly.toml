# Fly.io config for the geofight game server.
# Deploy from this folder:  cd server && fly deploy
app = "geooff"
primary_region = "yyz"   # Toronto

[http_service]
  internal_port = 3001   # MUST match the port the server listens on (PORT, default 3001)
  force_https = true
  # In-memory rooms + live WebSockets: keep exactly one machine always running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # Fly polls this to decide the app is healthy; the server returns {"ok":true}.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
